# Рабочий сайт: приложение + Caddy (HTTPS-сертификат получает сам).
services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data/places.db:/app/data/places.db:ro
    expose:
      - "8000"

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
