<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Куда сходить вдвоём</title>
  <meta name="description" content="Подберём место для свидания: кафе, кино, прогулки, активный отдых — с проверкой и маршрутом.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <header class="head">
        <div class="brand">
          <span class="logo" aria-hidden="true">💞</span>
          <div>
            <h1>Куда сходить вдвоём</h1>
            <p class="tagline">Опиши настроение — подберём место, проверим и проложим маршрут</p>
          </div>
        </div>
        <span id="status" class="status"></span>
      </header>

      <form id="form" class="form" autocomplete="off">
        <div class="search">
          <label class="search-label" for="text">✨ Чего хочется?</label>
          <div class="search-box">
            <textarea id="text" rows="2" placeholder="Например: уютное место с видом на город и вкусным кофе"></textarea>
            <button type="button" id="clear" class="clear" aria-label="Очистить поле" title="Очистить" hidden>✕</button>
          </div>
          <div class="examples" id="examples">
            <button type="button" data-q="Мясное, но недорого">🥩 Мясное, но недорого</button>
            <button type="button" data-q="Красивый вид и вино">🍷 Вид и вино</button>
            <button type="button" data-q="Уютная кофейня с десертами">☕ Уютная кофейня</button>
            <button type="button" data-q="Что-то активное">🎳 Что-то активное</button>
            <button type="button" data-q="Погулять у воды на закате">🌅 Закат у воды</button>
            <button type="button" data-q="Купить фигурку Hello Kitty">🎀 Hello Kitty</button>
          </div>
        </div>

        <div class="field">
          <span class="label">🏙️ Город</span>
          <div class="row">
            <div class="input-ico grow">
              <span aria-hidden="true">📍</span>
              <input id="city" list="cities" value="Москва" aria-label="Город">
            </div>
            <datalist id="cities"></datalist>
            <button type="button" id="nearby" class="ghost">🧭 Рядом со мной</button>
          </div>
          <div id="geoNote" class="geo" hidden></div>
        </div>

        <div class="field">
          <span class="label">🎯 Куда</span>
          <div class="chips" id="category">
            <button type="button" data-v="any" class="on">✨ Всё</button>
            <button type="button" data-v="food">🍽️ Поесть</button>
            <button type="button" data-v="coffee">☕ Кофе</button>
            <button type="button" data-v="bar">🍸 Бар</button>
            <button type="button" data-v="cinema">🎬 Кино</button>
            <button type="button" data-v="theatre">🎭 Театр</button>
            <button type="button" data-v="museum">🏛️ Музеи</button>
            <button type="button" data-v="park">🌳 Прогулка</button>
            <button type="button" data-v="active">🎳 Активное</button>
            <button type="button" data-v="quest">🔐 Квест</button>
            <button type="button" data-v="karaoke">🎤 Караоке</button>
            <button type="button" data-v="viewpoint">🌇 Красивый вид</button>
            <button type="button" data-v="shopping">🛍️ Купить</button>
          </div>
        </div>

        <div class="field" id="foodField">
          <span class="label">😋 Что хочешь поесть</span>
          <div class="input-ico">
            <span aria-hidden="true">🍣</span>
            <input id="food" placeholder="суши, пицца, грузинская кухня…" aria-label="Что хочешь поесть">
          </div>
        </div>

        <div class="field">
          <span class="label">💰 Бюджет на человека</span>
          <div class="seg" id="budget">
            <button type="button" data-v="0" class="on">Любой</button>
            <button type="button" data-v="1">до 700 ₽</button>
            <button type="button" data-v="2">до 1500 ₽</button>
            <button type="button" data-v="3">до 3000 ₽</button>
          </div>
        </div>

        <button type="submit" id="go" class="primary"><span>🔎 Найти места</span></button>
      </form>

      <div id="summary" class="summary" hidden></div>
      <ol id="results" class="results"></ol>
      <footer class="foot">Данные: © OpenStreetMap, 2ГИС · маршруты OSRM</footer>
    </aside>

    <main id="map" class="map" aria-label="Карта"></main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
